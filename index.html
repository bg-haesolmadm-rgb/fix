<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기자재 수리 신청</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eef1f5;
      font-family: 'Noto Sans KR', system-ui, sans-serif;
      color: #1b2330;
    }
    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 16px 64px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header { display: flex; flex-direction: column; gap: 6px; padding: 0 4px; }
    header .org { margin: 0; font-size: 14px; font-weight: 500; color: #4a5568; }
    header h1 { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.3; }
    header .desc { margin: 0; font-size: 15px; color: #4a5568; line-height: 1.6; }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 1px 2px rgba(20, 30, 50, 0.06);
    }
    .card h2 { margin: 0; font-size: 17px; font-weight: 700; }

    .targets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .target {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; min-height: 120px; padding: 20px 12px;
      border: 2px solid #d5dbe4; border-radius: 12px;
      background: #fff; color: #3a4556;
      font-family: inherit; cursor: pointer;
    }
    .target[aria-pressed="true"] { border-color: #1d4f9c; background: #e8f0fc; color: #163d78; }
    .target .t-name { font-size: 16px; font-weight: 700; }
    .target .t-sub { font-size: 13px; opacity: 0.8; }

    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field label { font-size: 14px; font-weight: 500; }
    .row { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px; }

    input, select, textarea {
      width: 100%;
      font-family: inherit; font-size: 16px; color: #1b2330;
      border: 1px solid #c3cad6; border-radius: 10px; background: #fbfcfd;
    }
    input, select { height: 48px; padding: 0 14px; }
    select { padding: 0 12px; }
    textarea { padding: 12px 14px; line-height: 1.6; resize: vertical; }
    input:focus, select:focus, textarea:focus, button:focus-visible {
      outline: 2px solid #1d4f9c; outline-offset: 1px;
    }

    .notice {
      margin: 0; padding: 12px 14px; border-radius: 10px;
      background: #fff4e5; color: #7a4100; font-size: 14px; line-height: 1.6;
    }
    [hidden] { display: none !important; }

    .submit {
      height: 56px; border: none; border-radius: 12px;
      background: #1d4f9c; color: #fff;
      font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer;
    }
    .submit:disabled { background: #8aa3c8; cursor: default; }
    .foot { margin: 0; text-align: center; font-size: 13px; color: #5a6475; }

    .msg { margin: 0; padding: 14px 16px; border-radius: 10px; font-size: 15px; line-height: 1.6; }
    .msg.ok { background: #e6f4ea; color: #1e5631; }
    .msg.err { background: #fdecea; color: #8a1c13; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="org">[배곧해솔중학교] 교육정보부</p>
      <h1>기자재 수리 신청</h1>
      <p class="desc">고장난 기자재 정보를 입력해주세요!</p>
    </header>

    <form id="form" novalidate>
      <div style="display:flex;flex-direction:column;gap:20px">

        <section class="card">
          <h2>1. 수리 대상</h2>
          <div class="targets">
            <button type="button" class="target" data-target="기자재" aria-pressed="true">
              <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
              <span class="t-name">기자재</span>
              <span class="t-sub">PC, 프로젝터, TV 등</span>
            </button>
            <button type="button" class="target" data-target="패드함" aria-pressed="false">
              <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 7v8M12 7v8M16 7v8M4 18h16"></path></svg>
              <span class="t-name">패드함</span>
              <span class="t-sub">충전·잠금 이상 등</span>
            </button>
          </div>
        </section>

        <section class="card">
          <h2>2. 신청자 정보</h2>
          <div class="field">
            <label for="name">신청자</label>
            <input id="name" type="text" placeholder="예) 홍길동" autocomplete="name">
          </div>
          <div class="field">
            <label for="phone">전화번호</label>
            <input id="phone" type="tel" placeholder="예) 010-0000-0000 또는 내선번호" autocomplete="tel">
          </div>
        </section>

        <section class="card">
          <h2 id="detailTitle">3. 수리 요청 내용</h2>
          <p class="notice" id="padNotice" hidden>패드 자체의 수리는 이상 패드와 함께 정보부로 보내주세요.</p>
          <div class="row">
            <div class="field">
              <label for="floor">층</label>
              <select id="floor">
                <option value="">선택</option>
                <option value="1층">1층</option>
                <option value="2층">2층</option>
                <option value="3층">3층</option>
                <option value="4층">4층</option>
                <option value="5층">5층</option>
              </select>
            </div>
            <div class="field">
              <label for="place">요청 위치</label>
              <input id="place" type="text" placeholder="예) 2-3반 교실, 과학실">
            </div>
          </div>
          <div class="field">
            <label for="detail" id="detailLabel">수리 요청 내용</label>
            <textarea id="detail" rows="5" placeholder="예) 프로젝터 전원이 켜지지 않습니다."></textarea>
          </div>
        </section>

        <p class="msg" id="msg" role="status" hidden></p>

        <button type="submit" class="submit" id="submitBtn">신청하기</button>
        <p class="foot">입력한 내용은 담당자 확인용 구글 시트에 저장됩니다.</p>
      </div>
    </form>
  </div>

  <script>
    // ▼ Apps Script 웹 앱 URL 을 여기에 붙여넣으세요 (https://script.google.com/macros/s/.../exec)
    var API_URL = 'https://script.google.com/macros/s/AKfycbzCuqX0YjKsXkL-NQDgf4MO06mWkG48ktv843ld5okZWIpXMPoj_BcGOZnL-IE9xaU/exec';

    var target = '기자재';

    var TEXT = {
      '기자재': {
        title: '3. 수리 요청 내용',
        label: '수리 요청 내용',
        place: '예) 2-3반 교실, 과학실',
        detail: '예) 프로젝터 전원이 켜지지 않습니다.'
      },
      '패드함': {
        title: '3. 패드함 이상 내용',
        label: '이상 내용',
        place: '예) 2-1반 교실',
        detail: '예) 3번 칸 충전이 되지 않습니다.'
      }
    };

    var buttons = document.querySelectorAll('.target');
    var form = document.getElementById('form');
    var submitBtn = document.getElementById('submitBtn');
    var msg = document.getElementById('msg');

    function setTarget(t) {
      target = t;
      buttons.forEach(function (b) {
        b.setAttribute('aria-pressed', b.dataset.target === t ? 'true' : 'false');
      });
      var x = TEXT[t];
      document.getElementById('detailTitle').textContent = x.title;
      document.getElementById('detailLabel').textContent = x.label;
      document.getElementById('place').placeholder = x.place;
      document.getElementById('detail').placeholder = x.detail;
      document.getElementById('padNotice').hidden = (t !== '패드함');
    }

    buttons.forEach(function (b) {
      b.addEventListener('click', function () { setTarget(b.dataset.target); });
    });

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + type;
      msg.hidden = false;
    }

    function val(id) { return document.getElementById(id).value.trim(); }

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      var data = {
        target: target,
        name: val('name'),
        phone: val('phone'),
        floor: val('floor'),
        place: val('place'),
        detail: val('detail')
      };

      var missing = [
        ['name', '신청자'], ['phone', '전화번호'], ['floor', '층'],
        ['place', '요청 위치'], ['detail', TEXT[target].label]
      ].filter(function (f) { return !data[f[0]]; });

      if (missing.length) {
        showMsg(missing.map(function (f) { return f[1]; }).join(', ') + '을(를) 입력해 주세요.', 'err');
        document.getElementById(missing[0][0]).focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '보내는 중...';
      msg.hidden = true;

      // Content-Type 을 따로 지정하지 않아야(text/plain) Apps Script 에서 CORS 오류가 나지 않습니다.
      fetch(API_URL, { method: 'POST', body: JSON.stringify(data) })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          if (!result.ok) throw new Error(result.error || '알 수 없는 오류');
          showMsg('신청이 접수되었습니다. 감사합니다.', 'ok');
          form.reset();
          setTarget('기자재');
        })
        .catch(function (err) {
          showMsg('저장하지 못했습니다: ' + (err && err.message ? err.message : '잠시 후 다시 시도해 주세요.'), 'err');
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = '신청하기';
          msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
    });
  </script>
</body>
</html>
